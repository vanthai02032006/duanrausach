services:
  db:
    image: postgres:16-alpine
    container_name: greenfarm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: greenfarm_db
      POSTGRES_USER: greenfarm_user
      POSTGRES_PASSWORD: greenfarm_demo_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenfarm_user -d greenfarm_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - greenfarm_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenfarm_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://greenfarm_user:greenfarm_demo_password@db:5432/greenfarm_db
      ALLOWED_HOSTS: "*"
      SITE_URL: http://192.11.12.107:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: greenfarm_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  greenfarm_pgdata:
